<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="version" content="3.03">
  <title>315-休假作業管制工具 3.03</title>
  <style>
    :root{color-scheme:dark;--bg:#090f17;--panel:#111b28;--panel2:#182536;--line:#31465e;--text:#f1f6fc;--muted:#9aacbf;--blue:#356fa9;--green:#277b61;--yellow:#8b7023;--red:#a33e4b;--purple:#7050a0;--shadow:0 15px 40px #0009}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid #4a617b;background:#26384c;border-radius:10px;padding:9px 11px;font-weight:780;touch-action:manipulation}button:active{transform:translateY(1px);filter:brightness(.9)}button:disabled{opacity:.28}.primary{background:var(--blue)}.good{background:var(--green)}.warn{background:var(--yellow)}.danger{background:var(--red)}.purple{background:var(--purple)}
    input,select,textarea{background:#0a131e;border:1px solid #40556d;border-radius:9px;padding:9px;outline:none}input:focus,select:focus,textarea:focus{border-color:#73b6f2;box-shadow:0 0 0 2px #3986c633}
    .app{width:min(100%,780px);margin:auto;padding:9px}.top{position:sticky;top:0;z-index:20;padding:8px 0 10px;background:#090f17ed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.title-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.title-line h1{margin:0;font-size:18px}.title-line small{color:#8498ad}.settings-button{width:36px;height:34px;padding:0}.date-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:8px}.date-line input{min-width:0}.date-line button{padding-inline:8px;white-space:nowrap}.view-tabs{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}.view-tabs button{background:#1d2c3d}.view-tabs button.active{background:#356fa9;box-shadow:inset 0 0 0 2px #9bcdf7}.view-tabs .status-toggle{min-width:88px;background:#3d3155}
    section{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:16px}.count{font-size:12px;color:var(--muted)}.zone-dismiss .section-head{background:#38232b}.zone-pending .section-head{background:#342f1e}.zone-leave .section-head{background:#17352e}.zone-face .section-head{background:#28213b}.content{padding:8px}.empty{padding:18px 8px;text-align:center;color:var(--muted)}
    .person{margin-bottom:6px;padding:3px;border:2px solid transparent;border-radius:10px;background:#0e1824;overflow:hidden}.person:last-child{margin-bottom:0}.person.state-new,.person.state-changed{border-color:#f5f7fa}.person.state-sent-add{border-color:#48d186}.person.state-sent-edit{border-color:#e5c044}.person.state-sent-delete{border-color:#ef5361}.person-line{display:grid;grid-template-columns:64px minmax(96px,1fr) 48px 48px 36px;gap:3px;align-items:center;white-space:nowrap}.name{width:64px;min-width:0;padding:6px 3px;text-align:center}.summary{display:flex;align-items:center;justify-content:center;width:100%;height:34px;min-width:0;padding:0 3px;border:1px solid #3c5269;border-radius:7px;background:#1b2a3b;font-weight:800;font-variant-numeric:tabular-nums;overflow:hidden}.summary.date,.summary.transport{cursor:pointer}.transport{color:#fff;font-size:13px;letter-spacing:-.4px}.transport.unconfirmed{background:#57242b}.transport.confirm-blue{background:#244f7a}.transport.confirm-yellow{background:#6d571d}.transport.confirm-green{background:#1d6148}.transport.route-pending{color:#ff6672}.transport.route-done{color:#fff}.mini{width:36px;height:34px;padding:0;font-size:18px}.status-line{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tag{display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border:1px solid #41556d;border-radius:999px;background:#172434;color:#c6d5e5;font-size:11px}.tag.face-pending{color:#ffb1b8;border-color:#7d3e47}.tag.face-adjusted{color:#ffe48a;border-color:#7a672a}.tag.face-done{color:#91e5b7;border-color:#34745a}.tag.record-delete{color:#ff8d97}.train-line{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:4px;padding:5px 7px;border:1px solid #554978;border-radius:7px;background:#1b192b;color:#d8d0f7;font-size:11px}.train-line b{color:#af9ce8}.face-divider{margin:8px 0 5px;padding:5px 8px;border-radius:7px;background:#243448;color:#c8d8e8;font-size:12px;font-weight:850}
    dialog{width:min(94vw,650px);max-height:92vh;padding:0;border:0;background:transparent;color:inherit}dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}.modal{display:flex;flex-direction:column;max-height:92vh;border:1px solid #526b86;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#1a293a;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:17px}.close{padding:5px 10px}.modal-body{padding:12px;overflow:auto}.modal-foot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px;padding:10px 12px;border-top:1px solid var(--line);background:#101a27}.field{margin-bottom:12px}.field>label{display:block;margin-bottom:5px;color:#b9c8d8;font-size:13px}.field input{width:100%}.date-edit{display:grid;grid-template-columns:1fr auto;gap:6px}.choice-title{margin:10px 0 5px;color:#b9c8d8;font-size:13px}.choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.choices button{min-width:0;padding:8px 1px;background:#26384c;font-size:12px;white-space:nowrap}.choices button.tool-plane{background:#315f91}.choices button.tool-boat{background:#347566}.choices button.tool-c130{background:#7b5597}.choices button.route-default{background:#4b5868}.choices button.route-magao{background:#90641c}.choices button.route-taichung{background:#287684}.choices button.route-taitung{background:#8a456d}.choices button.route-pingtung{background:#8a493c}.choices button.route-night{background:#303a7a}.choices button.selected{outline:2px solid #fff;box-shadow:0 0 0 3px #589de0;filter:brightness(1.28)}.action-list{display:grid;gap:7px}.action-list button{text-align:left;padding:12px}.action-list .neutral{background:#26384c}.setting-list{display:grid;gap:8px}.setting-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid #40546c;border-radius:10px;background:#0d1722}.setting-item input[type=number],.setting-item select{width:120px;margin-left:auto}.system-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.system-grid button{min-width:0}.hint{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.5}.io{width:100%;min-height:180px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}.preview{margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#0a131e;color:#c8d8e8;white-space:pre-wrap}.training-row{display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:8px;padding:8px;border:1px solid #40546c;border-radius:10px}.training-row input{width:100%;min-width:0}.training-row .date-edit button{grid-column:auto;padding-inline:9px}.training-row>button{width:100%}.fast-target{color:#8dc9ff}.year-grid,.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.year-grid button,.month-grid button,.day-grid button{min-width:0;height:46px;padding:4px 1px;font-size:16px}.year-grid button.selected,.month-grid button.selected{border:2px solid #fff;background:#397fba;box-shadow:0 0 0 3px #62b8f5,0 0 14px #4ba8eeaa;color:#fff;filter:brightness(1.2)}.day-grid button{height:44px;font-size:15px}.toast{position:fixed;z-index:100;top:max(12px,env(safe-area-inset-top));left:50%;max-width:90vw;padding:10px 15px;border-radius:10px;background:#eef6ff;color:#122033;font-weight:850;text-align:center;box-shadow:var(--shadow);transform:translate(-50%,-120px);transition:.22s}.toast.show{transform:translate(-50%,0)}
    @media(max-width:420px){.app{padding:6px}.content{padding:6px}.person-line{grid-template-columns:61px minmax(88px,1fr) 45px 45px 34px}.name{width:61px}.transport{font-size:12px}.choices{gap:3px}.choices button{padding:8px 0;font-size:11px;letter-spacing:-.5px}.modal-body{padding:9px}.system-grid{gap:5px}.system-grid button{padding-inline:3px;font-size:12px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-line"><h1>休假作業管制工具 <small>v3.03</small></h1><button id="systemBtn" class="settings-button" title="系統">⚙️</button></div>
    <div class="date-line"><label for="reportDate">資料日期</label><input id="reportDate" type="date"><button id="addPerson" class="good">＋新增</button></div>
    <div class="view-tabs"><button id="timelineView" class="active">時序</button><button id="faceView">假面</button><button id="statusToggle" class="status-toggle">狀態：開</button></div>
  </header>

  <main id="timelinePane">
    <section class="zone-dismiss"><div class="section-head"><h2>銷假</h2><span id="dismissCount" class="count"></span></div><div id="dismissPeople" class="content"></div></section>
    <section class="zone-pending"><div class="section-head"><h2>待休</h2><span id="pendingCount" class="count"></span></div><div id="pendingPeople" class="content"></div></section>
    <section class="zone-leave"><div class="section-head"><h2>已休</h2><span id="leaveCount" class="count"></span></div><div id="leavePeople" class="content"></div></section>
  </main>
  <main id="facePane" hidden>
    <section class="zone-face"><div class="section-head"><h2>假面作業</h2><span id="faceCount" class="count"></span></div><div id="facePeople" class="content"></div></section>
  </main>
</div>

<dialog id="leaveDialog"><div class="modal"><div class="modal-head"><h3>休假資料</h3><button class="close" data-close="leaveDialog">×</button></div><div class="modal-body">
  <div class="field"><label>休假日期</label><div class="date-edit"><input id="editStart" type="date"><button data-fast-input="editStart" data-fast-label="休假日">快速選</button></div></div>
  <div class="field"><label>收假日期</label><div class="date-edit"><input id="editEnd" type="date"><button data-fast-input="editEnd" data-fast-label="收假日">快速選</button></div></div>
  <div class="choice-title">休假交通</div><div id="startTools" class="choices"></div>
  <div class="choice-title">休假航線</div><div id="startRoutes" class="choices"></div>
  <div class="choice-title">收假交通</div><div id="endTools" class="choices"></div>
  <div class="choice-title">收假航線</div><div id="endRoutes" class="choices"></div>
</div><div class="modal-foot"><button data-close="leaveDialog">取消</button><button id="saveLeave" class="good">套用</button></div></div></dialog>

<dialog id="specialToolDialog"><div class="modal"><div class="modal-head"><h3>特殊交通內容</h3><button class="close" data-close="specialToolDialog">×</button></div><div class="modal-body"><div id="specialChoices" class="choices"><button data-special="退伍">退伍</button><button data-special="本島">本島</button><button data-special="離退">離退</button><button data-special="調職">調職</button></div><div class="field" style="margin-top:12px"><label>自訂內容</label><input id="customSpecial" maxlength="12"></div></div><div class="modal-foot"><button data-close="specialToolDialog">取消</button><button id="saveSpecial" class="good">套用</button></div></div></dialog>

<dialog id="actionDialog"><div class="modal"><div class="modal-head"><h3 id="actionTitle">作業選單</h3><button class="close" data-close="actionDialog">×</button></div><div class="modal-body"><div class="action-list">
  <button id="undoAction" class="purple">↩️ 撤銷操作</button>
  <button id="finalizeAction" class="neutral">📌 標記為定稿資料</button>
  <button id="sentAddAction" class="good">新增已回傳上級</button>
  <button id="sentEditAction" class="warn">改動已回傳上級</button>
  <button id="sentDeleteAction" class="danger">刪除已回傳上級</button>
  <button id="confirmStartAction" class="primary">休假交通確認</button>
  <button id="confirmEndAction" class="primary">收假交通確認</button>
  <button id="routeReportAction" class="neutral">特殊航線申報</button>
  <button id="faceDoneAction" class="neutral">🎭 假面完成</button>
  <button id="trainingAction" class="purple">🎓 受訓資料</button>
  <button id="deleteAction" class="danger">🗑️ 手動移除資料</button>
</div></div></div></dialog>

<dialog id="undoDialog"><div class="modal"><div class="modal-head"><h3 id="undoTitle">撤銷操作</h3><button class="close" data-close="undoDialog">×</button></div><div class="modal-body"><div class="action-list">
  <button id="undoRecord" class="neutral">撤銷目前資料狀態</button>
  <button id="undoFace" class="neutral">撤銷假面完成</button>
  <button id="undoStartConfirm" class="neutral">撤銷休假交通確認</button>
  <button id="undoEndConfirm" class="neutral">撤銷收假交通確認</button>
  <button id="undoStartRoute" class="neutral">撤銷休假特殊航線申報</button>
  <button id="undoEndRoute" class="neutral">撤銷收假特殊航線申報</button>
</div><div class="hint">灰色項目代表目前沒有可撤銷的紀錄。撤銷後視窗會保持開啟，可以連續處理。</div></div></div></dialog>

<dialog id="routeDialog"><div class="modal"><div class="modal-head"><h3>特殊航線申報</h3><button class="close" data-close="routeDialog">×</button></div><div class="modal-body"><div class="action-list"><button id="reportStartRoute" class="good">休假特殊航線申報成功</button><button id="reportEndRoute" class="good">收假特殊航線申報成功</button></div><div class="hint">未申報成功顯示紅字；成功後恢復白字。休假與收假分開記錄。</div></div></div></dialog>

<dialog id="trainingDialog"><div class="modal"><div class="modal-head"><h3>受訓資料</h3><button class="close" data-close="trainingDialog">×</button></div><div class="modal-body"><div id="trainingRows"></div><button id="addTraining" class="purple" style="width:100%">＋新增受訓</button></div><div class="modal-foot"><button data-close="trainingDialog">取消</button><button id="saveTraining" class="good">儲存</button></div></div></dialog>

<dialog id="fastDateDialog"><div class="modal"><div class="modal-head"><h3 id="fastTarget" class="fast-target">快速選擇日期</h3><button class="close" data-close="fastDateDialog">×</button></div><div class="modal-body"><div id="yearGrid" class="year-grid"></div><div id="monthGrid" class="month-grid"></div><div id="dayGrid" class="day-grid"></div></div></div></dialog>

<dialog id="systemDialog"><div class="modal"><div class="modal-head"><h3>系統</h3><button class="close" data-close="systemDialog">×</button></div><div class="modal-body">
  <div class="system-grid"><button id="copyLeaveText" class="good">複製休假文</button><button id="copyWorkText" class="warn">複製工作文</button><button id="exportBtn" class="purple">匯出交接碼</button><button id="importBtn" class="purple">匯入交接碼</button><button id="finalizeAll" class="primary">全部標記定稿</button></div>
  <div class="setting-list"><label class="setting-item"><span>暗綠色上限（天）</span><input id="greenMax" type="number" min="0" max="30"></label><label class="setting-item"><span>暗黃色上限（天）</span><input id="yellowMax" type="number" min="1" max="60"></label></div>
  <div class="hint">0～綠色上限為暗綠；下一天至黃色上限為暗黃；更早完成一律暗藍。顏色依確認當下的提前天數固定，不會每日變色。</div>
</div><div class="modal-foot"><button data-close="systemDialog">取消</button><button id="saveSettings" class="good">儲存參數</button></div></div></dialog>

<dialog id="exportDialog"><div class="modal"><div class="modal-head"><h3>3.0 交接碼</h3><button class="close" data-close="exportDialog">×</button></div><div class="modal-body"><textarea id="exportText" class="io" readonly></textarea></div><div class="modal-foot"><button data-close="exportDialog">關閉</button><button id="copyExport" class="good">複製</button></div></div></dialog>
<dialog id="importDialog"><div class="modal"><div class="modal-head"><h3>匯入交接碼</h3><button class="close" data-close="importDialog">×</button></div><div class="modal-body"><textarea id="importText" class="io" placeholder="貼上 3.0 或舊版交接碼"></textarea><div id="importPreview" class="preview">尚未檢查</div></div><div class="modal-foot"><button data-close="importDialog">取消</button><button id="checkImport" class="primary">檢查</button><button id="applyImport" class="danger" disabled>全部取代</button></div></div></dialog>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';
const KEY='OracleShion:Utility:LeaveOperationControl:data:v3',OLD_KEY='OracleShion:Utility:LeaveOperationControl:data';
const TOOLS=['公機','自機','公船','自船','C130'],SPECIALS=['退伍','本島','離退','調職'],ROUTES=['默認','馬高','台中','台東','屏東','夜航'],OLD_ROUTES=['默認','馬高','台中','台東','屏東'];
const $=s=>document.querySelector(s),zoneEls={dismiss:$('#dismissPeople'),pending:$('#pendingPeople'),leave:$('#leavePeople')};
let state=load(),editId=null,specialTarget=null,fastInput=null,fastLabel='',fastYear=0,fastMonth=0,pendingImport=null,saveTimer=0;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fresh(){return{v:7,view:'timeline',statusVisible:true,reportDate:today(),params:{greenMax:3,yellowMax:6},people:[]}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||'')))return false;const d=new Date(s+'T00:00:00');return !isNaN(d)&&iso(d)===s}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(s,n){if(!validDate(s))return'';const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)}
function diffDays(a,b){if(!validDate(a)||!validDate(b))return 99999;return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000)}
function md(s){return validDate(s)?s.slice(5).replace('-',''):'----'}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function tool(v){const s=String(v||'').trim().slice(0,12);return s||'公機'}
function training(t){return{name:String(t?.name||'').slice(0,40),start:validDate(t?.start)?t.start:'',end:validDate(t?.end)?t.end:''}}
function validTraining(t){return t.name.trim()&&validDate(t.start)&&validDate(t.end)&&t.end>=t.start}
function normalizeConfirm(v){return v&&Number.isFinite(+v.lead)&&validDate(v.date)?{date:v.date,lead:+v.lead}:null}
function validRecord(v){return['new','changed','final','sent-add','sent-edit','sent-delete'].includes(v)}
function validFace(v){return['pending','adjusted','done'].includes(v)}
function normalizePerson(p,legacy=false){const st=tool(p.startTool),et=tool(p.endTool),sr=ROUTES.includes(p.startRoute)?p.startRoute:'默認',er=ROUTES.includes(p.endRoute)?p.endRoute:'默認';return{id:String(p.id||uid()),name:String(p.name||'').slice(0,12),startDate:validDate(p.startDate)?p.startDate:'',endDate:validDate(p.endDate)?p.endDate:'',startTool:st,endTool:et,startRoute:sr,endRoute:er,recordState:legacy?'final':validRecord(p.recordState)?p.recordState:'final',startConfirm:legacy?null:normalizeConfirm(p.startConfirm),endConfirm:legacy?null:normalizeConfirm(p.endConfirm),startRouteReported:legacy?false:p.startRouteReported===true,endRouteReported:legacy?false:p.endRouteReported===true,faceState:legacy?'pending':validFace(p.faceState)?p.faceState:'pending',trainings:Array.isArray(p.trainings)?p.trainings.map(training).filter(validTraining):[]}}
function normalize(x,legacy=false){const q=x?.params||{},g=Math.max(0,Math.min(30,parseInt(q.greenMax,10)||3)),y=Math.max(g+1,Math.min(60,parseInt(q.yellowMax,10)||6));return{v:7,view:x?.view==='face'?'face':'timeline',statusVisible:x?.statusVisible!==false,reportDate:validDate(x?.reportDate)?x.reportDate:today(),params:{greenMax:g,yellowMax:y},people:Array.isArray(x?.people)?x.people.map(p=>normalizePerson(p,legacy)):[]}}
function load(){try{const current=JSON.parse(localStorage.getItem(KEY));if(current?.people)return normalize(current)}catch(e){}try{const old=JSON.parse(localStorage.getItem(OLD_KEY));if(old?.people){const migrated=normalize(old,true);localStorage.setItem(KEY,JSON.stringify(migrated));return migrated}}catch(e){}return fresh()}
function save(immediate=false){clearTimeout(saveTimer);if(immediate)localStorage.setItem(KEY,JSON.stringify(state));else saveTimer=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(state)),80)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900)}
function person(id){return state.people.find(p=>p.id===id)}
function zoneOf(p){if(validDate(p.endDate)&&state.reportDate>=addDays(p.endDate,1))return'dismiss';if(!validDate(p.startDate)||state.reportDate<p.startDate)return'pending';return'leave'}
function zoneSort(zone,a,b){const k=zone==='pending'?'startDate':'endDate',av=validDate(a[k])?a[k]:'9999-99-99',bv=validDate(b[k])?b[k]:'9999-99-99';return av.localeCompare(bv)||a.name.localeCompare(b.name,'zh-Hant')}
function needsRoute(p,side){const t=p[side+'Tool'],r=p[side+'Route'];return r!=='默認'||t==='C130'||!TOOLS.includes(t)}
function displayTransport(p,side){const t=p[side+'Tool'],r=p[side+'Route'];if(r!=='默認')return r;if(t==='自機')return'✈️';if(t==='自船')return'🚢';return t}
function transportClass(p,side){const c=p[side+'Confirm'];let cls='unconfirmed';if(c){cls=c.lead<=state.params.greenMax?'confirm-green':c.lead<=state.params.yellowMax?'confirm-yellow':'confirm-blue'}const route=needsRoute(p,side)?(p[side+'RouteReported']?'route-done':'route-pending'):'';return `${cls} ${route}`}
function frameClass(p){return p.recordState==='final'?'':`state-${p.recordState}`}
function faceLabel(p){return p.faceState==='done'?'已完成':p.faceState==='adjusted'?'被調整':'未完成'}
function faceTagClass(p){return p.faceState==='done'?'face-done':p.faceState==='adjusted'?'face-adjusted':'face-pending'}
function recordLabel(p){return({new:'新增未回傳',changed:'改動未回傳',final:'定稿資料','sent-add':'新增已回傳','sent-edit':'改動已回傳','sent-delete':'待確認刪除'})[p.recordState]}
function trainingHTML(p){return p.trainings.map(t=>`<div class="train-line"><span><b>受訓：</b>${md(t.start)}-${md(t.end)}</span><span>${esc(t.name)}</span></div>`).join('')}
function personHTML(p){const st=displayTransport(p,'start'),et=displayTransport(p,'end'),status=state.statusVisible?`<div class="status-line"><span class="tag ${faceTagClass(p)}">假面：${faceLabel(p)}</span><span class="tag${p.recordState==='sent-delete'?' record-delete':''}">${recordLabel(p)}</span></div>`:'';return `<article class="person ${frameClass(p)}" data-id="${esc(p.id)}"><div class="person-line"><input class="name" data-name maxlength="12" value="${esc(p.name)}" placeholder="姓名"><button class="summary date" data-leave>${md(p.startDate)}-${md(p.endDate)}</button><span class="summary transport ${transportClass(p,'start')}" title="休假：${esc(st)}">${esc(st)}</span><span class="summary transport ${transportClass(p,'end')}" title="收假：${esc(et)}">${esc(et)}</span><button class="mini purple" data-action>⋯</button></div>${status}${trainingHTML(p)}</article>`}
function renderTimeline(){for(const z of ['dismiss','pending','leave']){const list=state.people.filter(p=>zoneOf(p)===z).sort((a,b)=>zoneSort(z,a,b));zoneEls[z].innerHTML=list.length?list.map(personHTML).join(''):'<div class="empty">目前沒有資料</div>';$('#'+z+'Count').textContent=list.length+'把'}}
function renderFace(){const order={pending:0,adjusted:1,done:2},list=[...state.people].sort((a,b)=>order[a.faceState]-order[b.faceState]||zoneSort('pending',a,b));if(!list.length){$('#facePeople').innerHTML='<div class="empty">目前沒有資料</div>'}else{let last='',html='';for(const p of list){if(p.faceState!==last){last=p.faceState;html+=`<div class="face-divider">${faceLabel(p)}</div>`}html+=personHTML(p)}$('#facePeople').innerHTML=html}$('#faceCount').textContent=list.length+'把'}
function render(){$('#reportDate').value=state.reportDate;const face=state.view==='face';$('#timelinePane').hidden=face;$('#facePane').hidden=!face;$('#timelineView').classList.toggle('active',!face);$('#faceView').classList.toggle('active',face);$('#statusToggle').textContent=state.statusVisible?'狀態：開':'狀態：關';renderTimeline();renderFace()}
function addPerson(){const p=normalizePerson({id:uid(),recordState:'new',faceState:'pending'});state.people.push(p);save();render();setTimeout(()=>document.querySelector(`[data-id="${p.id}"] [data-name]`)?.focus(),0)}
function choiceClass(value,type){if(type==='tool')return value==='C130'?'tool-c130':value.includes('機')?'tool-plane':value.includes('船')?'tool-boat':'';return({默認:'route-default',馬高:'route-magao',台中:'route-taichung',台東:'route-taitung',屏東:'route-pingtung',夜航:'route-night'})[value]||''}
function choices(sel,arr,value,type){let html=arr.map(x=>`<button type="button" data-value="${esc(x)}" class="${choiceClass(x,type)}${x===value?' selected':''}">${esc(x)}</button>`).join('');if(type==='tool'){const custom=!TOOLS.includes(value);html+=`<button type="button" data-special-tool data-value="${custom?esc(value):''}" class="${custom?'selected':''}">${custom?esc(value):'特殊'}</button>`}$(sel).innerHTML=html}
function selected(sel){return $(sel+' .selected')?.dataset.value||''}
function selectOnly(box,b){box.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))}
function openLeave(id){editId=id;const p=person(id);if(!p)return;$('#editStart').value=p.startDate;$('#editEnd').value=p.endDate;choices('#startTools',TOOLS,p.startTool,'tool');choices('#endTools',TOOLS,p.endTool,'tool');choices('#startRoutes',ROUTES,p.startRoute,'route');choices('#endRoutes',ROUTES,p.endRoute,'route');$('#leaveDialog').showModal()}
function markEdited(p){if(p.recordState!=='new')p.recordState='changed';if(p.faceState==='done')p.faceState='adjusted'}
function openAction(id){editId=id;const p=person(id);if(!p)return;$('#actionTitle').textContent=(p.name.trim()||'未填姓名')+'・作業選單';$('#finalizeAction').disabled=p.recordState==='final';$('#sentAddAction').disabled=p.recordState!=='new';$('#sentEditAction').disabled=p.recordState!=='changed';$('#confirmStartAction').disabled=!validDate(p.startDate);$('#confirmEndAction').disabled=!validDate(p.endDate);$('#routeReportAction').disabled=!needsRoute(p,'start')&&!needsRoute(p,'end');$('#faceDoneAction').textContent=p.faceState==='done'?'🎭 假面已完成（重新確認）':'🎭 假面完成';$('#actionDialog').showModal()}
function setRecord(status,msg){const p=person(editId);if(!p)return;p.recordState=status;save();close('actionDialog');render();toast(msg)}
function confirmTransport(side){const p=person(editId);if(!p)return;const target=p[side+'Date'],label=side==='start'?'休假':'收假';if(!validDate(target)){toast('請先填寫有效日期');return}if(!confirm(`確定${label}交通已確認建檔成功？`))return;p[side+'Confirm']={date:state.reportDate,lead:Math.max(0,diffDays(target,state.reportDate))};if(p.recordState!=='sent-delete')p.recordState='final';save();close('actionDialog');render();toast(label+'交通已確認')}
function reportRoute(side){const p=person(editId);if(!p||!needsRoute(p,side)){toast('這一端沒有特殊航線');return}p[side+'RouteReported']=true;save();render();toast((side==='start'?'休假':'收假')+'特殊航線已申報成功');const other=side==='start'?'end':'start';if(!needsRoute(p,other)||p[other+'RouteReported'])close('routeDialog')}
function close(id){const d=$('#'+id);if(d?.open)d.close()}
function trainingRow(t={name:'',start:'',end:''}){return `<div class="training-row"><input class="train-name" data-train-name value="${esc(t.name)}" placeholder="訓名"><div class="date-edit"><input data-train-start type="date" value="${esc(t.start)}"><button type="button" data-fast-near="[data-train-start]" data-fast-label="受訓開始日">快速選</button></div><div class="date-edit"><input data-train-end type="date" value="${esc(t.end)}"><button type="button" data-fast-near="[data-train-end]" data-fast-label="受訓結束日">快速選</button></div><button type="button" class="danger" data-remove-training>移除此筆</button></div>`}
function openFast(input,label){fastInput=input;fastLabel=label;const base=validDate(input.value)?new Date(input.value+'T00:00:00'):new Date();fastYear=base.getFullYear();fastMonth=base.getMonth()+1;drawFast();$('#fastDateDialog').showModal()}
function drawFast(){$('#fastTarget').textContent='快速設定'+fastLabel;const now=new Date().getFullYear();$('#yearGrid').innerHTML=[now-1,now,now+1].map(y=>`<button type="button" data-year="${y}" class="${y===fastYear?'selected':''}">民國${y-1911}年</button>`).join('');$('#monthGrid').innerHTML=Array.from({length:12},(_,i)=>`<button type="button" data-month="${i+1}" class="${i+1===fastMonth?'selected':''}">${i+1}月</button>`).join('');const max=new Date(fastYear,fastMonth,0).getDate();$('#dayGrid').innerHTML=Array.from({length:31},(_,i)=>`<button type="button" data-day="${i+1}" ${i+1>max?'disabled':''}>${i+1}</button>`).join('')}
function openTraining(){const p=person(editId);if(!p)return;$('#trainingRows').innerHTML=p.trainings.length?p.trainings.map(trainingRow).join(''):trainingRow();close('actionDialog');$('#trainingDialog').showModal()}
function refreshUndo(){const p=person(editId);if(!p)return;$('#undoTitle').textContent=(p.name.trim()||'未填姓名')+'・撤銷操作';const labels={final:'撤銷定稿／落地狀態','sent-add':'撤銷新增已回傳','sent-edit':'撤銷改動已回傳','sent-delete':'撤銷刪除已回傳'};$('#undoRecord').textContent=labels[p.recordState]||'目前沒有可撤銷的資料狀態';$('#undoRecord').disabled=!labels[p.recordState];$('#undoFace').disabled=p.faceState!=='done';$('#undoStartConfirm').disabled=!p.startConfirm;$('#undoEndConfirm').disabled=!p.endConfirm;$('#undoStartRoute').disabled=!p.startRouteReported;$('#undoEndRoute').disabled=!p.endRouteReported}
function openUndo(){close('actionDialog');refreshUndo();$('#undoDialog').showModal()}
function undoDone(msg){save();render();refreshUndo();toast(msg)}
function undoConfirm(side){const p=person(editId);if(!p||!p[side+'Confirm'])return;p[side+'Confirm']=null;undoDone('已撤銷'+(side==='start'?'休假':'收假')+'交通確認')}
function reportText(){const ps=state.people.filter(p=>p.name.trim()&&zoneOf(p)==='leave').sort((a,b)=>zoneSort('leave',a,b));return `資料時間：${md(state.reportDate)}\n🎉放假${ps.length}員`+(ps.length?'\n\n'+ps.map(p=>`${p.name}${md(p.startDate)}-${md(p.endDate)}${p.startTool}${p.endTool}`).join('\n'):'')}
function workText(){const block=(title,z)=>`【${title}】\n`+(state.people.filter(p=>zoneOf(p)===z).sort((a,b)=>zoneSort(z,a,b)).map(p=>`${p.name||'未填姓名'}${md(p.startDate)}-${md(p.endDate)}${displayTransport(p,'start')}${displayTransport(p,'end')}｜${recordLabel(p)}｜假面${faceLabel(p)}`).join('\n')||'（無）');return [block('銷假','dismiss'),block('待休','pending'),block('已休','leave')].join('\nーー\n')}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('已複製到剪貼簿')}catch(e){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'已複製到剪貼簿':'複製失敗')}}
function crc32(bytes){let c=-1;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return((c^-1)>>>0).toString(16).padStart(8,'0').toUpperCase()}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const raw=atob(s),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function pack(){const raw=new TextEncoder().encode(JSON.stringify(state)),stream=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip')),zipped=new Uint8Array(await new Response(stream).arrayBuffer());return `MLR3G.${b64(zipped)}.${crc32(zipped)}`}
async function decodePayload(text){const m=String(text).trim().match(/^MLR([123])([GB])\.([A-Za-z0-9_-]+)\.([0-9A-Fa-f]{8})$/);if(!m)throw Error('交接碼格式不正確');const payload=unb64(m[3]);if(crc32(payload)!==m[4].toUpperCase())throw Error('檢查碼不符，交接碼可能損壞');let raw=payload;if(m[2]==='G'){if(typeof DecompressionStream==='undefined')throw Error('瀏覽器不支援舊版壓縮交接碼');const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(payload);w.close();raw=new Uint8Array(await new Response(ds.readable).arrayBuffer())}return JSON.parse(new TextDecoder().decode(raw))}
function decodeLegacyTool(v){if(typeof v==='number')return TOOLS[v]||'公機';return tool(v)}
function legacyCompact(a){const version=a[0],routes=version>=5?ROUTES:OLD_ROUTES,rows=Array.isArray(a[3])?a[3]:[];return normalize({reportDate:a[1],people:rows.map(r=>({id:r[0],name:r[1],startDate:r[2],startTool:decodeLegacyTool(r[3]),startRoute:routes[r[4]]||'默認',endDate:r[5],endTool:decodeLegacyTool(r[6]),endRoute:routes[r[7]]||'默認',trainings:version>=5&&Array.isArray(r[9])?r[9].map(t=>({name:t?.[0],start:t?.[1],end:t?.[2]})):[]}))},true)}
async function unpack(text){const parsed=await decodePayload(text);if(parsed?.v===7&&Array.isArray(parsed.people))return normalize(parsed);if(Array.isArray(parsed)&&[1,2,3,4,5,6].includes(parsed[0]))return legacyCompact(parsed);throw Error('不支援的資料版本')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)close(c.dataset.close);const fast=e.target.closest('[data-fast-input],[data-fast-near]');if(fast){const input=fast.dataset.fastInput?$('#'+fast.dataset.fastInput):fast.closest('.training-row').querySelector(fast.dataset.fastNear);openFast(input,fast.dataset.fastLabel)}const card=e.target.closest('.person');if(card){const id=card.dataset.id;if(e.target.closest('[data-leave],.transport'))openLeave(id);else if(e.target.closest('[data-action]'))openAction(id)}});
document.addEventListener('input',e=>{if(!e.target.matches('[data-name]'))return;const p=person(e.target.closest('.person').dataset.id);if(p&&p.name!==e.target.value){p.name=e.target.value;markEdited(p);save()}});
$('#timelineView').onclick=()=>{state.view='timeline';save();render()};$('#faceView').onclick=()=>{state.view='face';save();render()};$('#statusToggle').onclick=()=>{state.statusVisible=!state.statusVisible;save();render()};$('#addPerson').onclick=addPerson;$('#reportDate').onchange=e=>{if(validDate(e.target.value)){state.reportDate=e.target.value;save();render()}};
['#startTools','#endTools','#startRoutes','#endRoutes'].forEach(sel=>$(sel).onclick=e=>{const b=e.target.closest('[data-value]');if(!b)return;if(b.hasAttribute('data-special-tool')){specialTarget=sel;$('#customSpecial').value=b.dataset.value;$('#specialToolDialog').showModal();return}selectOnly($(sel),b)});
$('#specialChoices').onclick=e=>{const b=e.target.closest('[data-special]');if(b)$('#customSpecial').value=b.dataset.special};$('#saveSpecial').onclick=()=>{const value=$('#customSpecial').value.trim().slice(0,12);if(!value){toast('請輸入特殊內容');return}const b=$(specialTarget).querySelector('[data-special-tool]');b.dataset.value=value;b.textContent=value;selectOnly($(specialTarget),b);close('specialToolDialog')};
$('#yearGrid').onclick=e=>{const b=e.target.closest('[data-year]');if(b){fastYear=+b.dataset.year;drawFast()}};$('#monthGrid').onclick=e=>{const b=e.target.closest('[data-month]');if(b){fastMonth=+b.dataset.month;drawFast()}};$('#dayGrid').onclick=e=>{const b=e.target.closest('[data-day]');if(b&&!b.disabled&&fastInput){fastInput.value=`${fastYear}-${String(fastMonth).padStart(2,'0')}-${String(b.dataset.day).padStart(2,'0')}`;close('fastDateDialog')}};
$('#saveLeave').onclick=()=>{const p=person(editId);if(!p)return;const next={startDate:$('#editStart').value,endDate:$('#editEnd').value,startTool:selected('#startTools'),startRoute:selected('#startRoutes'),endTool:selected('#endTools'),endRoute:selected('#endRoutes')};if(next.startDate&&next.endDate&&next.endDate<next.startDate&&!confirm('收假日期早於休假日期，仍要保存嗎？'))return;const sc=['startDate','startTool','startRoute'].some(k=>p[k]!==next[k]),ec=['endDate','endTool','endRoute'].some(k=>p[k]!==next[k]);if(!sc&&!ec){close('leaveDialog');toast('內容沒有變更');return}markEdited(p);if(sc){p.startConfirm=null;p.startRouteReported=false}if(ec){p.endConfirm=null;p.endRouteReported=false}Object.assign(p,next);save();close('leaveDialog');render();toast('休假資料已更新')};
$('#finalizeAction').onclick=()=>setRecord('final','已標記為定稿資料');$('#sentAddAction').onclick=()=>setRecord('sent-add','新增資料已回傳');$('#sentEditAction').onclick=()=>setRecord('sent-edit','改動資料已回傳');$('#sentDeleteAction').onclick=()=>setRecord('sent-delete','刪除資料已回傳，等待確認消失');$('#confirmStartAction').onclick=()=>confirmTransport('start');$('#confirmEndAction').onclick=()=>confirmTransport('end');
$('#routeReportAction').onclick=()=>{const p=person(editId);close('actionDialog');$('#reportStartRoute').disabled=!needsRoute(p,'start')||p.startRouteReported;$('#reportEndRoute').disabled=!needsRoute(p,'end')||p.endRouteReported;$('#routeDialog').showModal()};$('#reportStartRoute').onclick=()=>reportRoute('start');$('#reportEndRoute').onclick=()=>reportRoute('end');
$('#undoAction').onclick=openUndo;$('#undoRecord').onclick=()=>{const p=person(editId);if(!p)return;const next={final:'new','sent-add':'new','sent-edit':'changed','sent-delete':'final'}[p.recordState];if(!next)return;p.recordState=next;undoDone('已撤銷目前資料狀態')};$('#undoFace').onclick=()=>{const p=person(editId);if(!p||p.faceState!=='done')return;p.faceState='pending';undoDone('已撤銷假面完成')};$('#undoStartConfirm').onclick=()=>undoConfirm('start');$('#undoEndConfirm').onclick=()=>undoConfirm('end');$('#undoStartRoute').onclick=()=>{const p=person(editId);if(!p)return;p.startRouteReported=false;undoDone('已撤銷休假特殊航線申報')};$('#undoEndRoute').onclick=()=>{const p=person(editId);if(!p)return;p.endRouteReported=false;undoDone('已撤銷收假特殊航線申報')};
$('#faceDoneAction').onclick=()=>{const p=person(editId);if(!p)return;p.faceState='done';save();close('actionDialog');render();toast('假面已標記完成')};$('#trainingAction').onclick=openTraining;$('#deleteAction').onclick=()=>{const p=person(editId);if(!p||!confirm(`確定手動移除「${p.name||'未填姓名'}」這把假？`))return;state.people=state.people.filter(x=>x.id!==p.id);save();close('actionDialog');render();toast('資料已手動移除')};
$('#addTraining').onclick=()=>$('#trainingRows').insertAdjacentHTML('beforeend',trainingRow());$('#trainingRows').onclick=e=>{const b=e.target.closest('[data-remove-training]');if(b)b.closest('.training-row').remove()};$('#saveTraining').onclick=()=>{const p=person(editId),list=[];for(const row of $('#trainingRows').querySelectorAll('.training-row')){const t={name:row.querySelector('[data-train-name]').value.trim(),start:row.querySelector('[data-train-start]').value,end:row.querySelector('[data-train-end]').value};if(!t.name&&!t.start&&!t.end)continue;if(!validTraining(t)){toast('受訓資料必須填妥名稱與正確日期');return}list.push(t)}p.trainings=list;markEdited(p);save();close('trainingDialog');render();toast('受訓資料已更新')};
$('#systemBtn').onclick=()=>{$('#greenMax').value=state.params.greenMax;$('#yellowMax').value=state.params.yellowMax;$('#systemDialog').showModal()};$('#saveSettings').onclick=()=>{const g=Math.max(0,Math.min(30,parseInt($('#greenMax').value,10)||3)),y=Math.max(g+1,Math.min(60,parseInt($('#yellowMax').value,10)||6));state.params={greenMax:g,yellowMax:y};save();close('systemDialog');render();toast('系統參數已儲存')};$('#finalizeAll').onclick=()=>{if(!confirm('確定將目前全部資料標記為定稿資料？'))return;state.people.forEach(p=>p.recordState='final');save();close('systemDialog');render();toast('全部資料已標記定稿')};
$('#copyLeaveText').onclick=()=>copyText(reportText());$('#copyWorkText').onclick=()=>copyText(workText());$('#exportBtn').onclick=async()=>{const b=$('#exportBtn');b.disabled=true;try{$('#exportText').value=await pack();close('systemDialog');$('#exportDialog').showModal()}catch(e){toast('交接碼壓縮失敗')}finally{b.disabled=false}};$('#copyExport').onclick=()=>copyText($('#exportText').value);$('#importBtn').onclick=()=>{$('#importText').value='';$('#importPreview').textContent='尚未檢查';$('#applyImport').disabled=true;pendingImport=null;close('systemDialog');$('#importDialog').showModal()};$('#checkImport').onclick=async()=>{try{pendingImport=await unpack($('#importText').value);$('#importPreview').textContent=`檢查成功\n資料日期：${pendingImport.reportDate}\n資料：${pendingImport.people.length}把`;$('#applyImport').disabled=false}catch(e){pendingImport=null;$('#applyImport').disabled=true;$('#importPreview').textContent='錯誤：'+e.message}};$('#applyImport').onclick=()=>{if(!pendingImport||!confirm('確定以匯入資料全部取代目前 3.0 資料？'))return;state=pendingImport;save(true);close('importDialog');render();toast('交接資料匯入完成')};
render();
})();
</script>
