<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="version" content="1.07">
  <title>手機休假回報工具</title>
  <style>
    :root{color-scheme:dark;--bg:#0a1019;--panel:#121c29;--panel2:#192637;--line:#31445b;--text:#eef5ff;--muted:#9fb0c5;--blue:#3979b7;--green:#277b67;--orange:#a8672d;--red:#a44451;--purple:#7652a8;--shadow:0 16px 42px #0009}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid #49617d;background:#26374b;border-radius:10px;padding:9px 12px;font-weight:750;touch-action:manipulation}button:active{transform:translateY(1px);filter:brightness(.9)}button:disabled{opacity:.28}.primary{background:var(--blue)}.good{background:var(--green)}.warn{background:var(--orange)}.danger{background:var(--red)}.purple{background:var(--purple)}
    .app{width:min(100%,760px);margin:auto;padding:10px}.top{position:sticky;top:0;z-index:20;background:#0a1019ed;backdrop-filter:blur(10px);padding:8px 0 10px;border-bottom:1px solid var(--line)}.title-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.title-line h1{font-size:19px;margin:0}.settings-button{width:34px;height:32px;padding:0;font-size:17px}.date-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}.date-line input{min-width:0}.date-line .add-top{padding:9px 8px;white-space:nowrap}
    input,select,textarea{background:#0b131e;border:1px solid #40546d;border-radius:9px;padding:9px;outline:none}input:focus,select:focus,textarea:focus{border-color:#75b9fa;box-shadow:0 0 0 2px #3986c633}.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.toolbar button{padding:9px 4px;font-size:14px}
    section{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#182536;border-bottom:1px solid var(--line)}.section-head h2{font-size:16px;margin:0}.content{padding:10px}.empty{color:var(--muted);text-align:center;padding:18px 8px}
    .person{border:1px solid #39506b;background:#101a27;border-radius:9px;margin-bottom:5px;padding:4px;overflow:hidden}.person:last-child{margin-bottom:0}.person-line{display:grid;grid-template-columns:64px minmax(92px,1fr) 44px 44px 34px 34px;align-items:center;gap:3px;white-space:nowrap}.person-scroll{overflow:visible;padding:0}.name-wrap{position:relative;width:64px;min-width:0}.name{width:64px;min-width:0;padding:6px 18px 6px 3px;text-align:center}.pin-button{position:absolute;z-index:2;right:-2px;top:-5px;width:23px;height:22px;padding:0;border-radius:50%;border:1px solid #856f2f;background:#302813;color:#ffd75a;font-size:11px;line-height:1}.pin-button.pinned{background:#745718;border-color:#ffc84d;color:#fff4bc;box-shadow:0 0 8px #e4ad3666}.summary{display:flex;align-items:center;justify-content:center;width:100%;height:32px;min-width:0;border:1px solid #3c526d;background:#1b2a3c;border-radius:7px;padding:0 3px;font-variant-numeric:tabular-nums;font-weight:750;overflow:hidden}.summary.date{cursor:pointer}.summary.tool{font-size:clamp(11px,3.5vw,15px);letter-spacing:-.5px}.summary.tool-long{font-size:10px}.summary.tool-xlong{font-size:8px}.summary.kind-plane{background:#294f78}.summary.kind-boat{background:#286454}.summary.kind-c130{background:#68488a}.summary.kind-special{background:#76501f}.summary.self-pay{border:2px solid #ff6470;box-shadow:inset 0 0 0 1px #5a1d25}.summary.route-magao{background:#75541d}.summary.route-taichung{background:#286d78}.summary.route-taitung{background:#754361}.summary.route-pingtung{background:#6e3f36}.summary.route-c130{box-shadow:inset 0 0 0 1px #b17ada}.summary.route-c130.self-pay{box-shadow:inset 0 0 0 1px #5a1d25}.mini{width:34px;height:32px;padding:0;font-size:17px;line-height:1}.train-line{display:flex;align-items:flex-start;flex-wrap:wrap;gap:3px 10px;margin-top:4px;padding:5px 8px;border:1px solid #594d78;border-radius:7px;background:linear-gradient(90deg,#201c31,#171a29);color:#ddd4ff;font-size:12px;line-height:1.45}.train-line b{color:#a996e9;font-weight:750}.train-date{white-space:nowrap;font-variant-numeric:tabular-nums}.train-course{min-width:0;overflow-wrap:anywhere}
    .generated{white-space:pre-wrap;line-height:1.65;font-variant-numeric:tabular-nums;color:#dceaff}.free{width:100%;min-height:110px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:6px}
    dialog{border:0;padding:0;background:transparent;color:inherit;width:min(94vw,650px);max-height:92vh}dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}.modal{background:var(--panel);border:1px solid #526b88;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:92vh;display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#1b293a;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:17px}.close{padding:5px 10px}.modal-body{padding:12px;overflow:auto}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#111b28}.field{margin-bottom:12px}.field>label{display:block;color:#b8c8da;font-size:13px;margin-bottom:5px}.field input{width:100%}.date-edit{display:grid;grid-template-columns:1fr auto;gap:6px}.choice-title{font-size:13px;color:#b8c8da;margin:10px 0 5px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.choices button{min-width:0;padding:8px 2px;font-size:13px;white-space:nowrap}.choices.tool-choices{grid-template-columns:repeat(6,1fr);gap:4px}.choices.tool-choices button{font-size:12px}.tool-plane{background:#315f91}.tool-boat{background:#347566}.tool-c130{background:#7b5597}.tool-self{border:3px solid #ff6470}.route-default{background:#4b5868}.route-magao{background:#90641c}.route-taichung{background:#287684}.route-taitung{background:#8a456d}.route-pingtung{background:#8a493c}.selected{outline:2px solid #fff;box-shadow:0 0 0 3px #57a9f3}
    #fastDateDialog{width:min(96vw,650px)}#fastDateDialog .modal{height:min(92vh,780px)}#fastDateDialog .modal-body{display:flex;flex-direction:column;gap:9px}.fast-target{font-weight:850;color:#8dc9ff;font-size:18px}.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.day-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.day-grid button,.month-grid button,.year-grid button{min-width:0;height:46px;padding:4px 1px;font-size:16px}.day-grid button{height:44px;font-size:15px}.pin-choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pin-choices button{height:56px;padding:4px;color:#ffe27b;background:#574317;border-color:#b28a2f;font-size:18px}.pin-note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}.setting-list{display:grid;gap:8px}.setting-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #40546d;border-radius:10px;background:#0e1824}.setting-item input{width:20px;height:20px;margin:0;accent-color:#4d9de0}.setting-item span{font-weight:750}.io{width:100%;min-height:180px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}.preview{background:#0b131e;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:8px;white-space:pre-wrap;color:#c9d9eb}.toast{position:fixed;z-index:100;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-120px);background:#eef6ff;color:#132033;border-radius:10px;padding:10px 16px;font-weight:800;box-shadow:var(--shadow);transition:.22s;max-width:90vw;text-align:center}.toast.show{transform:translate(-50%,0)}
    @media(max-width:420px){.app{padding:6px}.toolbar{gap:4px}.toolbar button{font-size:13px}.content{padding:6px}.section-head{padding:8px}.choices{gap:4px}.modal-body{padding:9px}.day-grid{gap:5px}.day-grid button{padding:4px 0;font-size:15px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title-line"><h1>手機休假回報工具 <small style="color:#8397ad">v1.07</small></h1><button id="reportSettingsBtn" class="settings-button" title="回報輸出設定">⚙️</button></div>
    <div class="date-line"><label for="reportDate">資料日期</label><input id="reportDate" type="date"><button id="addPerson" class="good add-top">＋新增</button></div>
    <div class="toolbar">
      <button id="sortStart" class="primary">休序</button><button id="sortEnd" class="primary">收序</button>
      <button id="exportBtn" class="purple">匯出</button><button id="importBtn" class="purple">匯入</button><button id="copyBtn" class="good">剪貼簿</button>
    </div>
  </div>

  <section><div class="section-head"><h2>放假人員</h2></div><div class="content" id="people"></div></section>
  <section><div class="section-head"><h2>特殊航線需求</h2></div><div class="content generated" id="routesOutput"></div></section>
  <section><div class="section-head"><h2>自由輸入</h2></div><div class="content"><textarea id="freeText" class="free" placeholder="輸入特殊回報內容"></textarea></div></section>
  <section><div class="section-head"><h2>受訓統計</h2></div><div class="content generated" id="trainingOutput"></div></section>
</div>

<dialog id="leaveDialog"><div class="modal"><div class="modal-head"><h3>快速輸入休假</h3><button class="close" data-close="leaveDialog">×</button></div><div class="modal-body">
  <div class="field"><label>休假日期</label><div class="date-edit"><input id="editStart" type="date"><button data-fast="start">快速選</button></div></div>
  <div class="field"><label>收假日期</label><div class="date-edit"><input id="editEnd" type="date"><button data-fast="end">快速選</button></div></div>
  <div class="choice-title">休假工具</div><div id="startTools" class="choices tool-choices"></div><div class="choice-title">休假航線</div><div id="startRoutes" class="choices"></div>
  <div class="choice-title">收假工具</div><div id="endTools" class="choices tool-choices"></div><div class="choice-title">收假航線</div><div id="endRoutes" class="choices"></div>
</div><div class="modal-foot"><button data-close="leaveDialog">取消</button><button id="saveLeave" class="good">套用</button></div></div></dialog>

<dialog id="trainDialog"><div class="modal"><div class="modal-head"><h3>受訓資料</h3><button class="close" data-close="trainDialog">×</button></div><div class="modal-body">
  <div class="field"><label>訓名</label><input id="trainName" type="text" maxlength="40"></div>
  <div class="field"><label>訓期起日</label><div class="date-edit"><input id="trainStart" type="date"><button data-train-fast="trainStart">快速選</button></div></div>
  <div class="field"><label>訓期迄日</label><div class="date-edit"><input id="trainEnd" type="date"><button data-train-fast="trainEnd">快速選</button></div></div>
</div><div class="modal-foot"><button id="clearTrain" class="danger">清除受訓</button><button data-close="trainDialog">取消</button><button id="saveTrain" class="good">套用</button></div></div></dialog>

<dialog id="fastDateDialog"><div class="modal"><div class="modal-head"><h3 id="fastTarget">快速選擇日期</h3><button class="close" data-close="fastDateDialog">×</button></div><div class="modal-body"><div id="yearGrid" class="year-grid"></div><div id="monthGrid" class="month-grid"></div><div id="dayGrid" class="day-grid"></div></div></div></dialog>

<dialog id="specialDialog"><div class="modal"><div class="modal-head"><h3>特殊工具內容</h3><button class="close" data-close="specialDialog">×</button></div><div class="modal-body">
  <div id="specialChoices" class="choices"><button data-special-value="退伍">退伍</button><button data-special-value="本島">本島</button><button data-special-value="離退">離退</button><button data-special-value="調職">調職</button><button id="customSpecialBtn">自訂</button></div>
  <div id="customSpecialField" class="field" hidden style="margin-top:12px"><label>自訂內容</label><input id="customSpecialInput" type="text" maxlength="12"><div class="hint">內容會自動縮小放入固定工具格。</div></div>
</div><div class="modal-foot"><button data-close="specialDialog">取消</button><button id="saveCustomSpecial" class="good" hidden>套用自訂</button></div></div></dialog>

<dialog id="pinDialog"><div class="modal"><div class="modal-head"><h3>星號置頂</h3><button class="close" data-close="pinDialog">×</button></div><div class="modal-body"><div id="pinChoices" class="pin-choices"><button data-pin-value="1">★1</button><button data-pin-value="2">★2</button><button data-pin-value="3">★3</button><button data-pin-value="4">★4</button><button data-pin-value="5">★5</button></div><div class="pin-note">置頂人員不參與休序／收序排列；1號固定第一、2號固定第二。若號碼已有持有人，原持有人會自動解除。</div></div><div class="modal-foot"><button id="clearPin" class="danger">解除置頂</button><button data-close="pinDialog">取消</button></div></div></dialog>

<dialog id="reportSettingsDialog"><div class="modal"><div class="modal-head"><h3>回報輸出設定</h3><button class="close" data-close="reportSettingsDialog">×</button></div><div class="modal-body"><div class="setting-list">
  <label class="setting-item"><input id="outputRoutes" type="checkbox"><span>特殊航線需求</span></label>
  <label class="setting-item"><input id="outputFreeText" type="checkbox"><span>自由輸入文字</span></label>
  <label class="setting-item"><input id="outputTraining" type="checkbox"><span>受訓統計</span></label>
</div><div class="hint">這些開關只控制「剪貼簿」產生的回報文字，不會刪除畫面資料或交接資料。</div></div><div class="modal-foot"><button data-close="reportSettingsDialog">取消</button><button id="saveReportSettings" class="good">儲存</button></div></div></dialog>

<dialog id="exportDialog"><div class="modal"><div class="modal-head"><h3>交接碼</h3><button class="close" data-close="exportDialog">×</button></div><div class="modal-body"><textarea id="exportText" class="io" readonly></textarea><div class="hint">可直接透過LINE、Discord或記事本傳送。這是資料交接碼，不是回報文字。</div></div><div class="modal-foot"><button data-close="exportDialog">關閉</button><button id="copyExport" class="good">複製交接碼</button></div></div></dialog>
<dialog id="importDialog"><div class="modal"><div class="modal-head"><h3>匯入交接碼</h3><button class="close" data-close="importDialog">×</button></div><div class="modal-body"><textarea id="importText" class="io" placeholder="在此貼上交接碼"></textarea><div id="importPreview" class="preview">尚未檢查</div></div><div class="modal-foot"><button data-close="importDialog">取消</button><button id="checkImport" class="primary">檢查</button><button id="applyImport" class="danger" disabled>確認覆蓋</button></div></div></dialog>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';
const KEY='OracleShion:Utility:MobileLeaveReport:data',TOOLS=['公機','自機','公船','自船','C130'],SPECIALS=['退伍','本島','離退','調職'],ROUTES=['默認','馬高','台中','台東','屏東'];
const $=s=>document.querySelector(s), peopleEl=$('#people'), routeEl=$('#routesOutput'), trainingEl=$('#trainingOutput');
let state=load(),editId=null,pinEditId=null,fastTarget=null,fastTraining=false,fastYear=0,fastMonth=0,specialTargetSelector=null,pendingImport=null,saveTimer=0;
reorderPinned();
function localToday(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function fresh(){return{v:4,reportDate:localToday(),freeText:'',output:{routes:true,freeText:true,training:true},people:[]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.people))return normalize(x)}catch(e){}return fresh()}
function normalizeTool(value){const s=String(value||'').trim();return s?s.slice(0,12):'公機'}
function normalize(x){const o=x.output&&typeof x.output==='object'?x.output:{};return{v:4,reportDate:validDate(x.reportDate)?x.reportDate:localToday(),freeText:String(x.freeText||''),output:{routes:o.routes!==false,freeText:o.freeText!==false,training:o.training!==false},people:x.people.map(p=>({id:String(p.id||uid()),name:String(p.name||''),pin:Number.isInteger(p.pin)&&p.pin>=1&&p.pin<=5?p.pin:0,startDate:validDate(p.startDate)?p.startDate:'',endDate:validDate(p.endDate)?p.endDate:'',startTool:normalizeTool(p.startTool),endTool:normalizeTool(p.endTool),startRoute:ROUTES.includes(p.startRoute)?p.startRoute:'默認',endRoute:ROUTES.includes(p.endRoute)?p.endRoute:'默認',trainName:String(p.trainName||''),trainStart:validDate(p.trainStart)?p.trainStart:'',trainEnd:validDate(p.trainEnd)?p.trainEnd:''}))}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||'')))return false;const d=new Date(s+'T00:00:00');return !isNaN(d)&&dateISO(d)===s}
function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function md(s){return validDate(s)?s.slice(5).replace('-',''):'----'}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(state)),80)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function person(id){return state.people.find(p=>p.id===id)}
function trainValid(p){return !!p.trainName.trim()&&validDate(p.trainStart)&&validDate(p.trainEnd)}
function badgeClass(route,tool){const routeMap={馬高:'route-magao',台中:'route-taichung',台東:'route-taitung',屏東:'route-pingtung'},kind=tool==='C130'?'kind-c130':tool.includes('機')?'kind-plane':tool.includes('船')?'kind-boat':'kind-special',fare=['自機','自船'].includes(tool)?'self-pay':'',c130=tool==='C130'?'route-c130':'';return [kind,routeMap[route]||'',fare,c130].filter(Boolean).join(' ')}
function toolSizeClass(tool){const n=Array.from(String(tool)).length;return n>6?'tool-xlong':n>4?'tool-long':''}
function render(){
  $('#reportDate').value=state.reportDate;$('#freeText').value=state.freeText;
  if(!state.people.length)peopleEl.innerHTML='<div class="empty">尚未新增人員</div>';
  else peopleEl.innerHTML=state.people.map(p=>`<div class="person" data-id="${esc(p.id)}"><div class="person-scroll"><div class="person-line"><span class="name-wrap"><input class="name" data-name maxlength="3" value="${esc(p.name)}" placeholder="姓名"><button class="pin-button${p.pin?' pinned':''}" data-pin title="設定星號置頂">${p.pin?'★'+p.pin:'☆'}</button></span><button class="summary date" data-leave title="編輯休假">${md(p.startDate)}-${md(p.endDate)}</button><span class="summary tool ${badgeClass(p.startRoute,p.startTool)} ${toolSizeClass(p.startTool)}" title="${esc(p.startTool)}">${esc(p.startTool)}</span><span class="summary tool ${badgeClass(p.endRoute,p.endTool)} ${toolSizeClass(p.endTool)}" title="${esc(p.endTool)}">${esc(p.endTool)}</span><button class="mini purple" data-train title="受訓">🎓</button><button class="mini danger" data-delete title="刪除">🗑️</button></div>${(p.trainName||p.trainStart||p.trainEnd)?`<div class="train-line"><span class="train-date"><b>受訓時間：</b>${md(p.trainStart)}-${md(p.trainEnd)}</span><span class="train-course"><b>訓名：</b>${esc(p.trainName||'未填')}</span></div>`:''}</div></div>`).join('');
  routeEl.textContent=buildRoutes()||'目前沒有特殊航線需求';trainingEl.textContent=buildTraining(true)||'目前沒有受訓資料';
}
function addPerson(){state.people.push({id:uid(),name:'',pin:0,startDate:'',endDate:'',startTool:'公機',endTool:'公機',startRoute:'默認',endRoute:'默認',trainName:'',trainStart:'',trainEnd:''});save();render();setTimeout(()=>peopleEl.querySelector('.person:last-child [data-name]').focus(),0)}
function specialLabel(tool,route){if(tool==='C130')return 'C130-'+(route==='默認'?'松山':route);return route==='默認'?'':route}
function buildRoutes(){const map=new Map();state.people.forEach(p=>{[['休',p.startDate,p.startTool,p.startRoute],['收',p.endDate,p.endTool,p.endRoute]].forEach(([dir,date,tool,route])=>{const label=specialLabel(tool,route);if(!label||!validDate(date)||!p.name.trim())return;if(!map.has(label))map.set(label,new Map());const dm=map.get(label);if(!dm.has(date))dm.set(date,[]);dm.get(date).push(`${p.name.trim()}（${dir}）`)})});const order=['松山','馬高','台中','台東','屏東','C130-松山','C130-馬高','C130-台中','C130-台東','C130-屏東'];return [...map.keys()].sort((a,b)=>{const ai=order.indexOf(a),bi=order.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)}).map(label=>{const dates=[...map.get(label).keys()].sort();return `${label}航線：\n`+dates.map(d=>`${md(d)}：${map.get(label).get(d).join('、')}`).join('\n')}).join('\n\n')}
function trainGroups(activeOnly){const m=new Map();state.people.filter(p=>trainValid(p)&&(!activeOnly||trainingNow(p))).forEach(p=>{const k=[p.trainName.trim(),p.trainStart,p.trainEnd].join('\u001f');if(!m.has(k))m.set(k,{name:p.trainName.trim(),start:p.trainStart,end:p.trainEnd,people:[]});m.get(k).people.push(p)});return [...m.values()].sort((a,b)=>a.start.localeCompare(b.start)||a.name.localeCompare(b.name,'zh-Hant'))}
function buildTraining(activeOnly){const groups=trainGroups(activeOnly);if(!groups.length)return '';const total=groups.reduce((n,g)=>n+g.people.length,0);return `⭕受訓 ${total} 員\n\n`+groups.map(g=>`${g.name}${md(g.start)}-${md(g.end)}（受訓${g.people.length}員）\n`+g.people.map(p=>`${p.name.trim()||'未填姓名'}${md(p.startDate)}-${md(p.endDate)}${p.startTool}${p.endTool}`).join('\n')).join('\n\n')}
function dateInRange(date,start,end){return validDate(date)&&validDate(start)&&validDate(end)&&start<=date&&date<=end}
function trainingNow(p){return trainValid(p)&&dateInRange(state.reportDate,p.trainStart,p.trainEnd)}
function reportText(){const named=state.people.filter(p=>p.name.trim()),ps=named.filter(p=>dateInRange(state.reportDate,p.startDate,p.endDate)&&!trainingNow(p));let blocks=[];let head=`資料時間：${md(state.reportDate)}\n🎉放假${ps.length}員`;let lines=ps.map(p=>`${p.name.trim()}${md(p.startDate)}-${md(p.endDate)}${p.startTool}${p.endTool}`);blocks.push(head+(lines.length?'\n\n'+lines.join('\n'):''));const routes=buildRoutes();if(state.output.routes&&routes)blocks.push(routes);if(state.output.freeText&&state.freeText.trim())blocks.push(state.freeText.trim());const train=buildTraining(true);if(state.output.training&&train)blocks.push(train);return blocks.join('\nーー\n')}
function openLeave(id){editId=id;const p=person(id);if(!p)return;$('#editStart').value=p.startDate;$('#editEnd').value=p.endDate;fastTarget=null;renderChoices('#startTools',TOOLS,p.startTool,'tool');renderChoices('#endTools',TOOLS,p.endTool,'tool');renderChoices('#startRoutes',ROUTES,p.startRoute,'route');renderChoices('#endRoutes',ROUTES,p.endRoute,'route');$('#leaveDialog').showModal()}
function renderChoices(sel,arr,value,type){let html=arr.map(x=>`<button type="button" data-value="${x}" class="${choiceClass(x,type)}${x===value?' selected':''}">${x}</button>`).join('');if(type==='tool'){const special=!TOOLS.includes(value);html+=`<button type="button" data-special-button data-value="${special?esc(value):''}" class="warn${special?' selected':''}">${special?esc(value):'特殊'}</button>`}$(sel).innerHTML=html}
function choiceClass(x,type){if(type==='tool'){const kind=x==='C130'?'tool-c130':x.includes('船')?'tool-boat':'tool-plane',fare=['自機','自船'].includes(x)?' tool-self':'';return kind+fare}return x==='默認'?'route-default':({馬高:'route-magao',台中:'route-taichung',台東:'route-taitung',屏東:'route-pingtung'}[x]||'route-default')}
function selected(sel){return $(sel+' .selected')?.dataset.value||''}
function selectOnly(container,button){container.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===button))}
function openSpecial(selector){specialTargetSelector=selector;const current=selected(selector),custom=!TOOLS.includes(current)&&!SPECIALS.includes(current)?current:'';$('#customSpecialInput').value=custom;$('#customSpecialField').hidden=true;$('#saveCustomSpecial').hidden=true;$('#specialDialog').showModal()}
function applySpecial(value){const clean=String(value||'').trim().slice(0,12);if(!clean){toast('請輸入特殊內容');return}const box=$(specialTargetSelector),button=box.querySelector('[data-special-button]');button.dataset.value=clean;button.textContent=clean;selectOnly(box,button);const routeSel=specialTargetSelector==='#startTools'?'#startRoutes':'#endRoutes',defaultButton=$(routeSel+' [data-value="默認"]');if(defaultButton)selectOnly($(routeSel),defaultButton);closeDialog('specialDialog')}
function openFast(target,training){const input=$(training?'#'+target:'#edit'+(target==='start'?'Start':'End')),base=validDate(input.value)?new Date(input.value+'T00:00:00'):new Date();fastTarget=target;fastTraining=training;fastYear=base.getFullYear();fastMonth=base.getMonth()+1;drawFast();$('#fastDateDialog').showModal()}
function drawFast(){$('#fastTarget').textContent=fastTraining?(fastTarget==='trainStart'?'快速設定訓期起日':'快速設定訓期迄日'):(fastTarget==='start'?'快速設定休假日':'快速設定收假日');const now=new Date().getFullYear();$('#yearGrid').innerHTML=[now-1,now,now+1].map(y=>`<button data-year="${y}" class="${y===fastYear?'selected':''}">民國${y-1911}年</button>`).join('');$('#monthGrid').innerHTML=Array.from({length:12},(_,i)=>`<button data-month="${i+1}" class="${i+1===fastMonth?'selected':''}">${i+1}月</button>`).join('');const max=new Date(fastYear,fastMonth,0).getDate();$('#dayGrid').innerHTML=Array.from({length:31},(_,i)=>`<button data-day="${i+1}" ${i+1>max?'disabled':''}>${i+1}</button>`).join('')}
function chooseDay(day){const value=`${fastYear}-${String(fastMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;if(fastTraining)$('#'+fastTarget).value=value;else $(fastTarget==='start'?'#editStart':'#editEnd').value=value;closeDialog('fastDateDialog')}
function openTrain(id){editId=id;const p=person(id);if(!p)return;$('#trainName').value=p.trainName;$('#trainStart').value=p.trainStart;$('#trainEnd').value=p.trainEnd;$('#trainDialog').showModal()}
function closeDialog(id){$('#'+id).close()}
function reorderPinned(comparator){state.people=state.people.map((p,i)=>({p,i})).sort((a,b)=>{const ap=a.p.pin||0,bp=b.p.pin||0;if(ap||bp){if(ap&&bp)return ap-bp;return ap?-1:1}return comparator?(comparator(a.p,b.p)||a.i-b.i):a.i-b.i}).map(x=>x.p)}
function openPin(id){pinEditId=id;const p=person(id);if(!p)return;$('#pinChoices').querySelectorAll('[data-pin-value]').forEach(b=>b.classList.toggle('selected',+b.dataset.pinValue===p.pin));$('#pinDialog').showModal()}
function setPin(value){const p=person(pinEditId);if(!p)return;state.people.forEach(x=>{if(x.id!==p.id&&x.pin===value)x.pin=0});p.pin=value;reorderPinned();save();render();closeDialog('pinDialog');toast(`已設為置頂第${value}位`)}
function clearPin(){const p=person(pinEditId);if(!p)return;p.pin=0;reorderPinned();save();render();closeDialog('pinDialog');toast('已解除星號置頂')}
function sortBy(field,label){reorderPinned((a,b)=>{const av=validDate(a[field])?a[field]:'9999-99-99',bv=validDate(b[field])?b[field]:'9999-99-99';return av.localeCompare(bv)});save();render();toast(`已依${label}由早到晚排序，星號人員維持置頂`)}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已複製到剪貼簿')}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已複製到剪貼簿':'複製失敗，請手動選取')}}
function encodeTool(tool){const i=TOOLS.indexOf(tool);return i>=0?i:tool}
function decodeTool(value,version){if(version===1)return TOOLS[value];if(typeof value==='number')return TOOLS[value];if(typeof value==='string'&&value.trim()&&Array.from(value).length<=12)return value.trim();return null}
function compact(){return[4,state.reportDate,state.freeText,state.people.map(p=>[p.id,p.name,p.startDate,encodeTool(p.startTool),ROUTES.indexOf(p.startRoute),p.endDate,encodeTool(p.endTool),ROUTES.indexOf(p.endRoute),p.trainName,p.trainStart,p.trainEnd,p.pin||0]),[state.output.routes?1:0,state.output.freeText?1:0,state.output.training?1:0]]}
function expand(a){
  if(!Array.isArray(a)||![1,2,3,4].includes(a[0])||!validDate(a[1])||typeof a[2]!=='string'||!Array.isArray(a[3]))throw Error('不支援或不完整的資料版本');
  const version=a[0],rows=a[3].map(r=>{const st=decodeTool(r?.[3],version),et=decodeTool(r?.[6],version),pin=version>=3?r?.[11]:0;if(!Array.isArray(r)||r.length<11||typeof r[0]!=='string'||typeof r[1]!=='string'||typeof r[8]!=='string'||!st||!ROUTES[r[4]]||!et||!ROUTES[r[7]]||!Number.isInteger(pin)||pin<0||pin>5)throw Error('人員資料欄位異常');for(const i of [2,5,9,10])if(r[i]!==''&&!validDate(r[i]))throw Error('人員日期資料異常');return{id:r[0],name:r[1],pin,startDate:r[2],startTool:st,startRoute:ROUTES[r[4]],endDate:r[5],endTool:et,endRoute:ROUTES[r[7]],trainName:r[8],trainStart:r[9],trainEnd:r[10]}});
  const used=new Set();for(const p of rows)if(p.pin){if(used.has(p.pin))throw Error('星號置頂序號重複');used.add(p.pin)}
  const ordered=rows.map((p,i)=>({p,i})).sort((a,b)=>{const ap=a.p.pin||99,bp=b.p.pin||99;return ap-bp||a.i-b.i}).map(x=>x.p);
  const flags=version>=4&&Array.isArray(a[4])?a[4]:[1,1,1];
  return normalize({reportDate:a[1],freeText:a[2],output:{routes:flags[0]!==0,freeText:flags[1]!==0,training:flags[2]!==0},people:ordered})
}
function crc32(bytes){let c=-1;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return((c^-1)>>>0).toString(16).padStart(8,'0').toUpperCase()}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const raw=atob(s),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function pack(){const raw=new TextEncoder().encode(JSON.stringify(compact()));let payload=raw,type='B';if(typeof CompressionStream!=='undefined'){try{const cs=new CompressionStream('gzip'),writer=cs.writable.getWriter();writer.write(raw);writer.close();const zipped=new Uint8Array(await new Response(cs.readable).arrayBuffer());if(zipped.length<raw.length){payload=zipped;type='G'}}catch(e){}}return `MLR1${type}.${b64(payload)}.${crc32(payload)}`}
async function unpack(text){const m=String(text).trim().match(/^MLR1([GB])\.([A-Za-z0-9_-]+)\.([0-9A-Fa-f]{8})$/);if(!m)throw Error('交接碼格式不正確');const payload=unb64(m[2]);if(crc32(payload)!==m[3].toUpperCase())throw Error('檢查碼不符，內容可能缺字或損壞');let raw=payload;if(m[1]==='G'){if(typeof DecompressionStream==='undefined')throw Error('此瀏覽器不支援壓縮交接碼');const ds=new DecompressionStream('gzip'),writer=ds.writable.getWriter();writer.write(payload);writer.close();raw=new Uint8Array(await new Response(ds.readable).arrayBuffer())}let parsed;try{parsed=JSON.parse(new TextDecoder().decode(raw))}catch(e){throw Error('資料內容無法解析')}return expand(parsed)}
peopleEl.addEventListener('input',e=>{if(!e.target.matches('[data-name]'))return;const p=person(e.target.closest('.person').dataset.id);if(p){p.name=e.target.value;save();routeEl.textContent=buildRoutes()||'目前沒有特殊航線需求';trainingEl.textContent=buildTraining(true)||'目前沒有受訓資料'}});
peopleEl.addEventListener('click',e=>{const card=e.target.closest('.person');if(!card)return;const id=card.dataset.id;if(e.target.closest('[data-pin]'))openPin(id);else if(e.target.closest('[data-leave]'))openLeave(id);else if(e.target.closest('[data-train]'))openTrain(id);else if(e.target.closest('[data-delete]')&&confirm('確定刪除此人員？')){state.people=state.people.filter(p=>p.id!==id);save();render()}});
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)closeDialog(c.dataset.close)});
$('#addPerson').onclick=addPerson;$('#reportDate').onchange=e=>{if(validDate(e.target.value)){state.reportDate=e.target.value;save();trainingEl.textContent=buildTraining(true)||'目前沒有受訓資料'}};$('#freeText').oninput=e=>{state.freeText=e.target.value;save()};
$('#sortStart').onclick=()=>sortBy('startDate','休假日期');$('#sortEnd').onclick=()=>sortBy('endDate','收假日期');$('#copyBtn').onclick=()=>copyText(reportText());
$('#reportSettingsBtn').onclick=()=>{$('#outputRoutes').checked=state.output.routes;$('#outputFreeText').checked=state.output.freeText;$('#outputTraining').checked=state.output.training;$('#reportSettingsDialog').showModal()};
$('#saveReportSettings').onclick=()=>{state.output={routes:$('#outputRoutes').checked,freeText:$('#outputFreeText').checked,training:$('#outputTraining').checked};save();closeDialog('reportSettingsDialog');toast('回報輸出設定已儲存')};
document.querySelectorAll('[data-fast]').forEach(b=>b.onclick=()=>openFast(b.dataset.fast,false));document.querySelectorAll('[data-train-fast]').forEach(b=>b.onclick=()=>openFast(b.dataset.trainFast,true));
['#startTools','#endTools','#startRoutes','#endRoutes'].forEach(sel=>$(sel).onclick=e=>{const b=e.target.closest('[data-value]');if(!b)return;if(b.dataset.specialButton!==undefined){openSpecial(sel);return}selectOnly($(sel),b)});
$('#specialChoices').onclick=e=>{const b=e.target.closest('[data-special-value]');if(b)applySpecial(b.dataset.specialValue)};
$('#customSpecialBtn').onclick=()=>{$('#customSpecialField').hidden=false;$('#saveCustomSpecial').hidden=false;$('#customSpecialInput').focus()};
$('#saveCustomSpecial').onclick=()=>applySpecial($('#customSpecialInput').value);
$('#pinChoices').onclick=e=>{const b=e.target.closest('[data-pin-value]');if(b)setPin(+b.dataset.pinValue)};
$('#clearPin').onclick=clearPin;
function bindFast(){$('#yearGrid').onclick=e=>{const b=e.target.closest('[data-year]');if(b){fastYear=+b.dataset.year;drawFast()}};$('#monthGrid').onclick=e=>{const b=e.target.closest('[data-month]');if(b){fastMonth=+b.dataset.month;drawFast()}};$('#dayGrid').onclick=e=>{const b=e.target.closest('[data-day]');if(b&&!b.disabled)chooseDay(+b.dataset.day)}}bindFast();
$('#saveLeave').onclick=()=>{const p=person(editId);if(!p)return;const start=$('#editStart').value,end=$('#editEnd').value;if(start&&end&&end<start&&!confirm('收假日期早於休假日期，仍要保存嗎？'))return;Object.assign(p,{startDate:start,endDate:end,startTool:selected('#startTools'),endTool:selected('#endTools'),startRoute:selected('#startRoutes'),endRoute:selected('#endRoutes')});save();closeDialog('leaveDialog');render();toast('休假資料已更新')};
$('#saveTrain').onclick=()=>{const p=person(editId);if(!p)return;const draft={trainName:$('#trainName').value.trim(),trainStart:$('#trainStart').value,trainEnd:$('#trainEnd').value};if((draft.trainName||draft.trainStart||draft.trainEnd)&&!trainValid(draft)){toast('訓名與兩個訓期日期必須完整');return}if(draft.trainEnd&&draft.trainEnd<draft.trainStart){toast('訓期迄日不可早於起日');return}Object.assign(p,draft);save();closeDialog('trainDialog');render();toast('受訓資料已更新')};
$('#clearTrain').onclick=()=>{const p=person(editId);if(!p)return;p.trainName=p.trainStart=p.trainEnd='';save();closeDialog('trainDialog');render();toast('已清除受訓資料')};
$('#exportBtn').onclick=async()=>{try{$('#exportText').value=await pack();$('#exportDialog').showModal()}catch(e){toast('匯出失敗：'+e.message)}};$('#copyExport').onclick=()=>copyText($('#exportText').value);
$('#importBtn').onclick=()=>{$('#importText').value='';$('#importPreview').textContent='尚未檢查';$('#applyImport').disabled=true;pendingImport=null;$('#importDialog').showModal()};
$('#checkImport').onclick=async()=>{try{pendingImport=await unpack($('#importText').value);const trained=pendingImport.people.filter(trainValid).length;$('#importPreview').textContent=`檢查成功\n資料日期：${pendingImport.reportDate}\n人員：${pendingImport.people.length}人\n受訓：${trained}人`;$('#applyImport').disabled=false}catch(e){pendingImport=null;$('#applyImport').disabled=true;$('#importPreview').textContent='錯誤：'+e.message}};
$('#applyImport').onclick=()=>{if(!pendingImport)return;if(!confirm('確定以交接資料覆蓋目前全部資料？'))return;state=pendingImport;localStorage.setItem(KEY,JSON.stringify(state));closeDialog('importDialog');render();toast('交接資料匯入完成')};
render();
})();
</script>
